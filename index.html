<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101016">
<title>Ваша реклама — Музыка от Славы</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 15%,#34304f 0,transparent 48%),linear-gradient(145deg,#111119,#09090e);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(760px,100%);padding:clamp(38px,9vw,78px) 24px;text-align:center;border:1px solid #62558b;border-radius:32px;background:linear-gradient(145deg,#211e31ee,#12121cf2);box-shadow:0 25px 90px #0009,0 0 55px #9d7bff18}
.mark{width:58px;height:4px;margin:0 auto 30px;border-radius:9px;background:linear-gradient(90deg,#a78bfa,#f0abdf)}
h1{margin:0;font-size:clamp(42px,10vw,76px);line-height:1.05;letter-spacing:-.055em}
p{margin:22px 0 0;color:#d7c9f3;font-size:clamp(20px,5vw,32px);font-weight:650;letter-spacing:.02em}
footer{margin-top:42px;color:#8e879e;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
</style>
</head>
<body>
<main>
<div class="mark"></div>
<h1>Ваша реклама</h1>
<p>Музыка от Славы</p>
<footer>Связь и творчество</footer>
</main>
</body>
</html>
