<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Свояк Online</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080d0a;--panel:#111a14;--line:#294333;--green:#4cff9b;--text:#effff4;--muted:#a1b6a8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#153021,#080d0a 65%);color:var(--text);font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px 14px 45px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.logo{display:grid;place-items:center;width:48px;height:48px;border:1px solid #326b4a;border-radius:15px;color:var(--green);font-size:25px}.brand h1{margin:0;font-size:clamp(25px,5vw,38px)}.brand p{margin:3px 0;color:var(--muted)}.panel{background:#111a14ed;border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 6px}input{width:100%;background:#080f0a;color:white;border:1px solid #34513e;border-radius:11px;padding:13px;font:inherit}button{background:#193a27;color:white;border:1px solid #376a49;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer}button.primary{background:var(--green);color:#082012;border-color:var(--green)}button:disabled{opacity:.4}.muted{color:var(--muted)}.status{padding:12px;background:#0a140d;border:1px solid #294333;border-radius:12px;margin-top:12px}.hidden{display:none!important}.scores{display:flex;gap:10px;flex-wrap:wrap}.score{flex:1;min-width:130px;border:1px solid var(--line);background:#0b130e;padding:12px;border-radius:13px}.score strong{display:block;font-size:27px;color:var(--green)}.board{display:grid;grid-template-columns:repeat(5,minmax(115px,1fr));gap:8px;overflow-x:auto}.cat{text-align:center;color:var(--green);font-weight:800;font-size:13px}.tile{width:100%;margin-top:6px;color:var(--green);background:#10271a}.tile.used{opacity:.25}#answerChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}#answerChoices button{min-height:58px;white-space:normal}#answerChoices button:disabled{opacity:.72;border-color:#34513e;background:#16251b;color:#effff4}.q{font-size:clamp(22px,4vw,32px);line-height:1.3;margin:16px 0}.small{font-size:12px;color:var(--muted);line-height:1.5}@media(max-width:600px){.board{grid-template-columns:repeat(5,120px)}.panel{padding:14px}}
</style></head><body><main>
<header class="brand"><div class="logo">⚡</div><div><h1>СВОЯК ONLINE</h1><p>Думай быстрее. Играй честно. Забирай победу.</p></div></header>
<section class="panel" id="setup"><h2>Войти в игру</h2><label>Твой ник</label><input id="nick" maxlength="18" placeholder="Введи ник"><label>Код комнаты</label><input id="room" maxlength="8" placeholder="Код от друга"><div class="row" style="margin-top:14px"><button class="primary" id="join">Войти по коду</button><button id="create">Создать комнату</button></div><div id="status" class="status">Введи ник и код комнаты или создай новую.</div></section>
<section class="panel hidden" id="lobby"><div class="row"><div><h2>Комната <span id="code"></span></h2><p class="muted" id="lobbyText">Ожидание соперника…</p></div><div><label>Отправь другу этот код</label><input id="share" readonly><button id="copy" style="width:100%;margin-top:8px">Скопировать код</button></div></div><div class="scores" id="scores"></div><button id="start" class="primary" style="width:100%;margin-top:14px" disabled>Начать матч</button></section>
<section class="panel hidden" id="game"><div class="scores" id="gameScores"></div><h2>Выбери вопрос</h2><p class="muted">Кто первым нажмёт «Я отвечаю», тот получает право ответа.</p><div class="board" id="board"></div><div id="questionBox" class="hidden"><hr style="border-color:var(--line)"><p id="meta" class="muted"></p><div class="q" id="question"></div><button class="primary" id="buzz">Я отвечаю</button><div class="status" id="buzzStatus">Кнопка свободна</div><p id="answerHelp" class="muted"></p><div id="answerChoices" class="row"></div></div><div id="result" class="status hidden"></div></section>

</main>
<script>
const $=id=>document.getElementById(id);
const questions=[
["География",100,"Как называется столица Франции?","Париж"],["География",200,"Какой океан самый большой?","Тихий океан"],["География",300,"Какая страна имеет форму сапога?","Италия"],["География",400,"Как называется столица Канады?","Оттава"],
["Кино",100,"Как зовут волшебника с молнией на лбу?","Гарри Поттер"],["Кино",200,"Как зовут космического рейнджера из «Истории игрушек»?","Базз Лайтер"],["Кино",300,"Как зовут львёнка из «Короля Льва»?","Симба"],["Кино",400,"Как зовут снежного человека из «Холодного сердца»?","Олаф"],
["Музыка",100,"Сколько струн у стандартной гитары?","Шесть"],["Музыка",200,"Кто руководит оркестром?","Дирижёр"],["Музыка",300,"Как называется знак, повышающий ноту на полтона?","Диез"],["Музыка",400,"Сколько клавиш у стандартного фортепиано?","88"],
["Наука",100,"Какая планета известна как Красная планета?","Марс"],["Наука",200,"Сколько ног у паука?","Восемь"],["Наука",300,"Как называется процесс получения энергии растением с помощью света?","Фотосинтез"],["Наука",400,"Какой газ растения поглощают при фотосинтезе?","Углекислый газ"],
["Игры",100,"Какой герой Nintendo носит красную кепку и усы?","Марио"],["Игры",200,"В какой игре строят из блоков и исследуют мир?","Minecraft"],["Игры",300,"Как называется игровая валюта Fortnite?","В-баксы"],["Игры",400,"Как зовут героя серии The Legend of Zelda?","Линк"]
];
let client=null,channel=null,roomCode="",nick="",isHost=false,players={},state={scores:{},used:[],active:null,buzz:null,started:false},ready=false;
const setStatus=t=>$("status").textContent=t;
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function connect(make){
 const url="https://akdbjvfbxgianubcabvw.supabase.co",key="sb_publishable_FwzJYDkLuklBTa3AKIrz3Q_0tcnKEUF";nick=$("nick").value.trim();roomCode=make?code():$("room").value.trim().toUpperCase();
 if(!nick||!roomCode){setStatus(make?"Введи ник, чтобы создать комнату.":"Введи ник и код комнаты.");return}
 try{client=window.supabase.createClient(url,key);isHost=make;players={};state={scores:{},used:[],active:null,buzz:null,started:false};state.scores[nick]=0;
 channel=client.channel("svoyak-"+roomCode,{config:{presence:{key:nick},broadcast:{ack:true,self:false}}});
 channel.on("presence",{event:"sync"},()=>{const p=channel.presenceState();players={};Object.values(p).flat().forEach(x=>players[x.nick]=x);if(isHost&&!state.started&&Object.keys(players).length>=2) $("start").disabled=false;renderScores();$("lobbyText").textContent=Object.keys(players).length>=2?"Соперник подключился!":"Ожидание соперника…";});
 channel.on("broadcast",{event:"state"},({payload})=>{if(!isHost){state=payload;renderAll()}});
 channel.on("broadcast",{event:"buzz"},({payload})=>{if(isHost&&state.active!==null&&state.buzz===null){state.buzz=payload.nick;broadcastState();renderAll()}});
 channel.on("broadcast",{event:"answer"},({payload})=>{if(isHost&&state.active!==null&&state.buzz===payload.nick){finishAnswer(payload.choice,payload.nick)}});
 const res=await channel.subscribe(async s=>{if(s==="SUBSCRIBED"){await channel.track({nick,joined:Date.now()});$("setup").classList.add("hidden");$("lobby").classList.remove("hidden");$("code").textContent=roomCode;$("share").value=roomCode;setStatus("Подключено");if(make){players[nick]={nick};renderScores()} }});
 if(res&&res.error)throw res.error;
 }catch(e){setStatus("Не удалось подключиться: "+(e.message||e));}
}
async function broadcastState(){if(channel&&isHost)await channel.send({type:"broadcast",event:"state",payload:state})}
function renderScores(){const names=Object.keys(players);const arr=names.length?names:[nick];const html=arr.map(n=>'<div class="score">'+esc(n)+'<strong>'+Number(state.scores[n]||0)+'</strong><small>баллов</small></div>').join("");$("scores").innerHTML=html;$("gameScores").innerHTML=html;$("start").disabled=!(isHost&&names.length>=2&&!state.started)}
function renderBoard(){const cats=["География","Кино","Музыка","Наука","Игры"];$("board").innerHTML=cats.map(c=>'<div><div class="cat">'+c+'</div>'+[100,200,300,400].map(v=>{let i=questions.findIndex(q=>q[0]===c&&q[1]===v);return '<button class="tile '+(state.used.includes(i)?"used":"")+'" '+(state.used.includes(i)||!isHost||!state.started?"disabled":"")+' data-i="'+i+'">'+v+'</button>'}).join("")+'</div>').join("");$("board").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.active=+b.dataset.i;state.buzz=null;broadcastState();renderAll()})}
function choicesFor(q){const distractors=questions.map(x=>x[3]).filter(a=>a!==q[3]);const seed=questions.indexOf(q);const picked=[];for(let n=0;picked.length<3&&n<distractors.length*2;n++){const a=distractors[(seed*7+n*3)%distractors.length];if(a!==q[3]&&!picked.includes(a))picked.push(a)}return [q[3],...picked].sort((a,b)=>((a.length*7+seed*11)%17)-((b.length*7+seed*11)%17))}
function renderAll(){renderScores();if(state.started){$("game").classList.remove("hidden");renderBoard()}if(state.active!==null){$("questionBox").classList.remove("hidden");let q=questions[state.active];$("meta").textContent=q[0]+" · "+q[1]+" баллов";$("question").textContent=q[2];$("buzzStatus").textContent=state.buzz?state.buzz+" отвечает":"Кто первым нажмёт кнопку, тот отвечает";$("buzz").disabled=!!state.buzz;$("answerHelp").textContent=state.buzz?(state.buzz===nick?"Твой ход! Выбирай вариант ответа ниже.":"Соперник "+state.buzz+" отвечает. Ждём его выбор…"):"Нажми «Я отвечаю», чтобы получить право ответа. Варианты будут показаны ниже.";const canAnswer=state.buzz===nick;$("answerChoices").innerHTML=choicesFor(q).map(a=>'<button '+(!canAnswer?'disabled':'')+' data-answer="'+esc(a)+'">'+esc(a)+'</button>').join("");$("answerChoices").querySelectorAll("button").forEach(b=>b.onclick=()=>submitAnswer(b.dataset.answer))}else{$("questionBox").classList.add("hidden");$("answerChoices").innerHTML=""}if(state.used.length===questions.length){$("result").classList.remove("hidden");$("result").textContent="Матч завершён! Итоговый счёт показан выше."}}
async function submitAnswer(choice){if(state.active===null||state.buzz!==nick)return;if(isHost){finishAnswer(choice,nick)}else await channel.send({type:"broadcast",event:"answer",payload:{nick,choice}})}
async function finishAnswer(choice,who){if(!isHost||state.active===null||state.buzz!==who)return;const q=questions[state.active],correct=choice===q[3];state.scores[who]=(state.scores[who]||0)+(correct?q[1]:-q[1]);state.used.push(state.active);state.lastResult=who+": "+(correct?"верно! +":"неверно. ")+(correct?q[1]:-q[1])+" баллов. Правильный ответ: "+q[3];state.active=null;state.buzz=null;await broadcastState();renderAll();$("result").classList.remove("hidden");$("result").textContent=state.lastResult}
$("create").onclick=()=>connect(true);$("join").onclick=()=>connect(false);
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(roomCode);$("lobbyText").textContent="Код скопирован — отправь его другу."}catch{$("share").select();$("lobbyText").textContent="Выдели и скопируй код вручную."}};
$("start").onclick=async()=>{if(!isHost||Object.keys(players).length<2)return;state.started=true;await broadcastState();$("game").classList.remove("hidden");renderAll()};
$("buzz").onclick=async()=>{if(!channel||state.active===null||state.buzz)return;if(isHost){state.buzz=nick;await broadcastState();renderAll()}else await channel.send({type:"broadcast",event:"buzz",payload:{nick}})};

</script></body></html>
